<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Batch Downloader</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <div class="logo">&#8595;</div>
        <strong>Batch Downloader</strong>
        <span class="host-badge">127.0.0.1:8765</span>
      </div>
      <div class="top-meta">
        <span id="meta-dir" class="mono">~/Downloads</span>
        <span class="dot">&middot;</span>
        <span id="meta-format">MP4</span>
        <button id="settings-btn" type="button">Settings</button>
      </div>
    </header>

    <section id="settings-panel" class="settings" hidden>
      <div class="settings-field grow">
        <label for="output-dir">Output folder</label>
        <input id="output-dir" type="text" placeholder="~/Downloads" class="mono" />
      </div>
      <div class="settings-field">
        <label for="output-format">Output format</label>
        <select id="output-format">
          <option value="mp4">MP4</option>
          <option value="mkv">MKV</option>
          <option value="webm">WEBM</option>
          <option value="mov">MOV</option>
          <option value="original">Original (source)</option>
        </select>
      </div>
      <button id="settings-done-btn" type="button">Done</button>
    </section>

    <div class="addbar">
      <input id="video-url" type="text" placeholder="Paste .m3u8 link&hellip;" />
      <input id="video-name" type="text" placeholder="video_name" list="video-name-history" />
      <datalist id="video-name-history"></datalist>
      <button id="add-task-btn" class="primary">Add</button>
      <div class="divider"></div>
      <button id="start-btn" class="outline">Start all</button>
      <button id="stop-all-btn">Stop all</button>
    </div>

    <div id="status" class="status" hidden></div>

    <main class="split">
      <aside class="queue">
        <div class="queue-head">
          <span id="queue-count" class="queue-label">Queue &middot; 0</span>
          <button id="clear-finished-btn" class="linklike" type="button">Clear finished</button>
        </div>
        <div id="queue-list" class="queue-list">
          <div class="empty">Queue is empty. Paste a link above and press Enter.</div>
        </div>
      </aside>
      <section class="logpane">
        <div class="logpane-head">
          <div class="logpane-title">
            <span class="queue-label">Log</span>
            <span id="log-title" class="mono">&mdash;</span>
            <span id="log-live" class="live" hidden>&#9679; live</span>
          </div>
          <div class="logpane-actions">
            <button id="all-logs-btn" type="button">All tasks</button>
            <button id="clear-logs-btn" type="button">Clear</button>
          </div>
        </div>
        <pre id="logs"></pre>
        <div id="log-hint" class="logpane-foot">Click a queue card to switch this pane to that task&rsquo;s log. No interleaving.</div>
      </section>
    </main>

    <div id="edit-modal" class="modal" hidden>
      <div class="modal-backdrop" data-action="close-edit-modal"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <div class="modal-head">
          <h2 id="edit-modal-title">Edit queue item</h2>
          <button id="edit-modal-close-btn" type="button">Close</button>
        </div>
        <form id="edit-task-form" class="modal-form">
          <div>
            <label for="edit-video-url">Link (.m3u8)</label>
            <input id="edit-video-url" type="text" class="mono" />
          </div>
          <div>
            <label for="edit-video-name">Video name</label>
            <input id="edit-video-name" type="text" />
          </div>
          <div class="modal-actions">
            <button id="edit-modal-cancel-btn" type="button">Cancel</button>
            <button id="edit-modal-save-btn" type="submit" class="primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
