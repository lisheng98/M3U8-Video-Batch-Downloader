<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batch Downloader</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo">&#8595;</div>
      <strong>Batch Downloader</strong>
      <span class="host-badge">127.0.0.1:8765</span>
    </div>
    <div class="top-meta">
      <span class="mono" id="meta-dir">~/Downloads</span>
      <span class="dot">&#183;</span>
      <span id="meta-format">MP4</span>
      <button type="button" id="settings-btn">Settings</button>
    </div>
  </header>

  <section class="settings" id="settings-panel" hidden>
    <div class="settings-field grow">
      <label for="output-dir">Output folder</label>
      <input type="text" id="output-dir" class="mono" placeholder="~/Downloads" autocomplete="off">
    </div>
    <div class="settings-field">
      <label for="output-format">Output format</label>
      <select id="output-format"></select>
    </div>
    <button type="button" id="settings-done-btn">Done</button>
  </section>

  <div class="status" id="status" hidden></div>

  <div class="addbar">
    <input type="text" id="video-url" placeholder="Paste .m3u8 link&#8230;" autocomplete="off" spellcheck="false">
    <input type="text" id="video-name" placeholder="video_name" autocomplete="off" spellcheck="false" list="video-name-history">
    <datalist id="video-name-history"></datalist>
    <button type="button" id="add-task-btn" class="primary">Add</button>
    <div class="divider"></div>
    <button type="button" id="start-btn" class="outline">Start all</button>
    <button type="button" id="stop-all-btn">Stop all</button>
  </div>

  <main class="split">
    <section class="queue">
      <div class="queue-head">
        <span class="queue-label" id="queue-count">Queue &#183; 0</span>
        <button type="button" id="clear-finished-btn" class="linklike">Clear finished</button>
      </div>
      <div class="queue-list" id="queue-list"></div>
    </section>

    <section class="logpane">
      <div class="logpane-head">
        <div class="logpane-title">
          <span class="queue-label">Log</span>
          <span class="mono" id="log-title">&#8212;</span>
          <span class="live" id="log-live" hidden>&#9679; live</span>
        </div>
        <div class="logpane-actions">
          <button type="button" id="all-logs-btn">All tasks</button>
          <button type="button" id="copy-logs-btn">Copy</button>
          <button type="button" id="clear-logs-btn">Clear</button>
        </div>
      </div>
      <pre id="logs">Select a task on the left to view its log.</pre>
      <div class="logpane-foot" id="log-hint"></div>
    </section>
  </main>

  <div class="modal" id="edit-modal" hidden>
    <div class="modal-backdrop" data-action="close-edit-modal"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h2>Edit task</h2>
        <button type="button" id="edit-modal-close-btn" class="linklike">Close</button>
      </div>
      <form class="modal-form" id="edit-task-form">
        <div>
          <label for="edit-video-url">Link</label>
          <input type="text" id="edit-video-url" class="mono" placeholder="Link (.m3u8)" autocomplete="off" spellcheck="false">
        </div>
        <div>
          <label for="edit-video-name">Video name</label>
          <input type="text" id="edit-video-name" placeholder="video_name" autocomplete="off" spellcheck="false">
        </div>
        <div class="modal-actions">
          <button type="button" id="edit-modal-cancel-btn">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
